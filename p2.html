<html lang="zh"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Layer Privacy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 7vmin;
      color: white;
      text-align: center;
    }

    #backgroundCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 0;
      height: 100vh;
    }

    .hello {
      backdrop-filter: blur(0.4rem);
      -webkit-backdrop-filter: blur(0.4rem);
      background: rgba(255, 255, 255, 0.14);
      position: relative;
      z-index: 2;
      border-radius: 7vmin;
      box-shadow:
        0.1vmin 0.2vmin 0.1vmin rgba(255, 252, 238, 0.9) inset,
        -0.1vmin -0.2vmin 0.1vmin rgba(0, 0, 0, 0.1) inset,
        0 4px 30px rgba(137, 82, 113, 0.17);
      overflow: hidden;
    }

    .hello {
      padding-top: 5vmin;
      padding-bottom: 0vmin;
      margin-bottom: 7vmin;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      align-items: center;
      text-align: center;
    }

    .hello h1 {
      font-size: 13vmin;
      margin: 0;
      color: rgba(255, 255, 255, 0.85);
      text-shadow:
        0.17vmin 0.25vmin 0.17vmin #ea75a2e6,
        0.33vmin 0.5vmin 0.17vmin #ea5a91e6,
        0.5vmin 0.75vmin 0.17vmin #e25c8fe6,
        0.67vmin 1vmin 0.27vmin #d2447b7a,
        0.67vmin 1vmin 0.67vmin #b6225b3f,
        0.67vmin 1vmin 1.67vmin #bd0f5291,
        1.17vmin 1.17vmin 0.25vmin rgba(194, 34, 135, 0.15);
      filter: brightness(1.3);
    }

    #greeting2 {
      font-size: 7.7vmin;
      padding-top: 1.5vmin;
    }

    #greeting3 {
      font-size: 4.1vmin;
      text-shadow:
        0.17vmin 0.25vmin 0.17vmin #ea75a2e6,
        0.33vmin 0.5vmin 0.17vmin #d2447b7a,
        0.73vmin 0.5vmin 0.97vmin #ad165070,
        0.53vmin 0.4vmin 0.17vmin rgba(194, 34, 135, 0.15);
      padding-top: 3.8vmin;
      margin-bottom: 6.2vmin;
    }


  </style>
</head>

<body>
  <canvas id="backgroundCanvas" width="1686" height="959"></canvas>

  <section class="hello">
    <h1 id="greeting2">Unsharp Privacy</h1>
    <h1 id="greeting3">Collects nothing</h1>
  </section>

  <script>

    function drawBackground() {
      const canvas = document.getElementById("backgroundCanvas");
      const ctx = canvas.getContext("2d");
      const width = (canvas.width = window.innerWidth);
      const height = (canvas.height = window.innerHeight);

      // Draw gradient background
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, "#f581e0");
      gradient.addColorStop(0.5, "#f4b0c9");
      gradient.addColorStop(1, "#ffffff");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      // Draw symbols
      const numSymbols = 500;
      const minDistance = -3;
      const trySteps = 18;
      const symbols = ["★", "★", "★", "▲", "●", "■"];
      const drawnSymbols = [];

      function drawSymbol(cx, cy, size, rotation, alpha, symbol) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rotation);
        ctx.font = `${size}px Arial`;
        ctx.fillStyle = `rgba(255, 222, 244, ${alpha})`;
        ctx.fillText(symbol, 0, 0);
        ctx.restore();
      }

      function isTooClose(x, y, size) {
        for (const symbol of drawnSymbols) {
          const dx = x - symbol.x;
          const dy = y - symbol.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < minDistance + size + symbol.size) {
            return true;
          }
        }
        return false;
      }

      for (let i = 0; i < numSymbols; i++) {
        let x, y, size, rotation, alpha, symbol;
        let attempts = 0;
        if (i > 7) {
          size = Math.random() * 20 + 3;
        } else {
          size = Math.random() * 100 + 6;
        }

        do {
          x = Math.random() * width;
          y = Math.random() * height;
          attempts++;
        } while (isTooClose(x, y, size) && attempts < trySteps);

        if (attempts < trySteps) {
          alpha = 1 - y / height - 0.3;
          rotation = Math.random() * Math.PI * 2;
          symbol = symbols[Math.floor(Math.random() * symbols.length)];
          drawnSymbols.push({ x, y, size });
          drawSymbol(x, y, size, rotation, alpha, symbol);
        }
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      drawBackground();
    });

  </script>

</body></html>
